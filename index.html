<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>EduTrack | Attendance Monitoring</title>
	<style>
		:root{--ink:#172033;--muted:#687386;--line:#e5e9f0;--paper:#fff;--wash:#f5f7fb;--blue:#2563eb;--blue-dark:#1746b1;--green:#0f9f6e;--red:#d8435f;--amber:#c47a0b}
		*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.5 "Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0} .hidden{display:none!important}
		.app{min-height:100vh;display:flex}.sidebar{width:248px;background:var(--paper);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:#123779;margin:0 10px 32px}.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.nav{display:grid;gap:6px}.nav button{padding:11px 13px;border-radius:10px;text-align:left;background:transparent;color:var(--muted);font-weight:600}.nav button:hover,.nav button.active{background:#eaf1ff;color:var(--blue)}.user{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0}.user strong{display:block}.user small{color:var(--muted)}.logout{margin-top:14px;background:#fff1f3;color:var(--red);padding:10px;width:100%;border-radius:9px;font-weight:700}
		main{flex:1;min-width:0}.mobilebar{display:none;background:#fff;padding:14px 18px;border-bottom:1px solid var(--line);align-items:center;justify-content:space-between}.mobilebar button{background:transparent;font-size:22px}.page{padding:34px;max-width:1220px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}.eyebrow{color:var(--blue);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px}.title{font-size:30px;margin:4px 0}.muted{color:var(--muted)}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 5px 18px #25385808}.stat-label{color:var(--muted);font-weight:600}.stat-value{font-size:32px;font-weight:800;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}.columns{grid-template-columns:1.5fr 1fr}.card h2,.card h3{margin:0 0 16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:560px}.table th,.table td{text-align:left;padding:14px 12px;border-bottom:1px solid var(--line)}.table th{font-size:12px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:800}.badge.present{background:#dff7ed;color:#087a52}.badge.absent{background:#ffebee;color:#b72c47}.badge.late{background:#fff3d9;color:#9a6000}.badge.pending{background:#eef1f5;color:#7c8798}.btn{padding:11px 16px;border-radius:9px;background:var(--blue);color:#fff;font-weight:800}.btn:hover{background:var(--blue-dark)}.btn.secondary{background:#edf3ff;color:var(--blue)}.btn.danger{background:#fff1f3;color:var(--red)}.actions{display:flex;gap:8px;flex-wrap:wrap}.list{display:grid;gap:10px}.student-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px}.student-row span{display:block}.student-row small{color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe}.empty{padding:35px;text-align:center;color:var(--muted)}
		.login{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px;box-shadow:0 15px 50px #25385814}.login-card .brand{justify-content:center;margin:0 0 25px}.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--wash);padding:4px;border-radius:10px;margin-bottom:22px}.role-tabs button{padding:9px;background:transparent;color:var(--muted);border-radius:7px;font-weight:700}.role-tabs button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #25385812}.login-form{display:grid;gap:15px}.login-form .btn{width:100%;margin-top:5px}.demo{margin-top:20px;padding:12px;background:#edf3ff;color:#1d4baf;border-radius:9px;font-size:13px}.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;border-radius:9px;padding:13px 16px;box-shadow:0 8px 25px #0003}
		@media(max-width:800px){.sidebar{display:none}.mobilebar{display:flex}.page{padding:22px 16px}.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.title{font-size:25px}}
	</style>
</head>
<body>
	<section id="loginView" class="login">
		<form class="login-card" id="loginForm">
			<div class="brand"><span class="brand-mark">ET</span><span>EduTrack</span></div>
			<h1>Welcome back</h1><p class="muted">Sign in to your attendance workspace.</p>
			<div class="role-tabs" id="roleTabs"><button type="button" data-role="student" class="active">Student</button><button type="button" data-role="teacher">Teacher</button><button type="button" data-role="admin">Admin</button></div>
			<div class="field"><label for="username">Username or ID</label><input id="username" required placeholder="student1"></div>
			<div class="field"><label for="password">Password</label><input id="password" required type="password" placeholder="password123"></div>
			<button class="btn" type="submit">Sign in</button>
			<div class="demo" id="demoHint">Demo: student1 / password123</div>
		</form>
	</section>
	<div id="appView" class="app hidden">
		<aside class="sidebar"><div class="brand"><span class="brand-mark">ET</span><span>EduTrack</span></div><nav class="nav" id="nav"></nav><div class="user"><strong id="userName">Juan Dela Cruz</strong><small id="userRole">Student</small><button class="logout" id="logout">Log out</button></div></aside>
		<main><header class="mobilebar"><strong>EduTrack</strong><button id="menu">☰</button></header><div id="content"></div></main>
	</div>
	<div id="toast" class="toast hidden"></div>
	<script>
		const students=[['S2024-00123','Juan Dela Cruz','Present'],['S2024-00124','Maria Clara','Present'],['S2024-00125','Jose Rizal','Late'],['S2024-00126','Andres Bonifacio','Absent'],['S2024-00127','Melchora Aquino','Present']];
		const names={student:['Juan Dela Cruz','Student'],teacher:['Prof. Maria Santos','Teacher'],admin:['System Administrator','Administrator']}; let role='student', page='dashboard';
		const $=id=>document.getElementById(id); const badge=s=>`<span class="badge ${s.toLowerCase()}">${s}</span>`;
		function showToast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}
		function setRole(next){role=next;document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('active',b.dataset.role===role));$('demoHint').textContent=role==='admin'?'Demo: admin / admin123':`${role[0].toUpperCase()+role.slice(1)}: ${role}1 / password123`}
		function navItems(){return role==='student'?[['dashboard','Dashboard'],['attendance','My Attendance'],['profile','Profile']]:role==='teacher'?[['dashboard','Dashboard'],['record','Record Attendance'],['history','Attendance History'],['reports','Reports']]:[['dashboard','Dashboard'],['users','Users'],['classes','Classes'],['history','Full History']];}
		function renderNav(){$('nav').innerHTML=navItems().map(([id,label])=>`<button class="${page===id?'active':''}" data-page="${id}">${label}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}
		function dashboard(){let label=role==='student'?'Welcome, Juan Dela Cruz':role==='teacher'?'Hello, Prof. Maria Santos':'System Overview';return `<div class="page"><div class="topbar"><div><div class="eyebrow">Attendance workspace</div><h1 class="title">${label}</h1><p class="muted">${role==='student'?'BSIT-3A · Student ID S2024-00123':'Academic year 2026-2027'}</p></div><button class="btn" data-page="${role==='teacher'?'record':'attendance'}">${role==='teacher'?'Start Attendance':'View Records'}</button></div><div class="grid stats"><div class="card"><div class="stat-label">Present</div><div class="stat-value green">${role==='admin'?'1,172':'28'}</div></div><div class="card"><div class="stat-label">Absent</div><div class="stat-value red">${role==='admin'?'73':'2'}</div></div><div class="card"><div class="stat-label">Late</div><div class="stat-value amber">${role==='admin'?'46':'3'}</div></div><div class="card"><div class="stat-label">Attendance rate</div><div class="stat-value blue">94.2%</div></div></div><div class="grid columns"><div class="card"><h2>Recent attendance</h2>${attendanceTable(3)}</div><div class="card"><h2>Quick actions</h2><div class="list"><button class="btn secondary" data-page="${role==='teacher'?'record':'attendance'}">${role==='teacher'?'Open QR scanner':'Open attendance history'}</button><button class="btn secondary" data-action="help">Report an attendance issue</button></div></div></div></div>`}
		function attendanceTable(limit){return `<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Student</th><th>Status</th></tr></thead><tbody>${students.slice(0,limit).map((s,i)=>`<tr><td>Sept ${24-i}, 2026</td><td>${s[1]}</td><td>${badge(s[2])}</td></tr>`).join('')}</tbody></table></div>`}
		function attendancePage(){return `<div class="page"><div class="topbar"><div><div class="eyebrow">Records</div><h1 class="title">${role==='student'?'My Attendance':'Attendance Records'}</h1><p class="muted">Review recent attendance activity.</p></div><button class="btn secondary" data-page="dashboard">Back to dashboard</button></div><div class="card">${attendanceTable(students.length)}</div></div>`}
		function recordPage(){return `<div class="page"><div class="topbar"><div><div class="eyebrow">Teacher tools</div><h1 class="title">Record attendance</h1><p class="muted">Mark the current class roster.</p></div><button class="btn secondary" data-page="dashboard">Back</button></div><div class="card"><div class="list">${students.map((s,i)=>`<div class="student-row"><div><strong>${s[1]}</strong><small>${s[0]}</small></div><div class="actions"><span id="status-${i}">${badge(s[2])}</span><button class="btn" data-mark="${i}">Present</button><button class="btn danger" data-absent="${i}">Absent</button></div></div>`).join('')}</div></div></div>`}
		function render(){renderNav();$('content').innerHTML=page==='dashboard'?dashboard():page==='record'?recordPage():attendancePage();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>mark(+b.dataset.mark,'Present'));document.querySelectorAll('[data-absent]').forEach(b=>b.onclick=()=>mark(+b.dataset.absent,'Absent'));document.querySelectorAll('[data-action="help"]').forEach(b=>b.onclick=()=>showToast('Your report has been queued for review.'))}
		function mark(index,status){students[index][2]=status;$(`status-${index}`).innerHTML=badge(status);showToast(`${students[index][1]} marked ${status}.`)}
		$('roleTabs').onclick=e=>{if(e.target.dataset.role)setRole(e.target.dataset.role)};$('loginForm').onsubmit=e=>{e.preventDefault();$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('userName').textContent=names[role][0];$('userRole').textContent=names[role][1];render()};$('logout').onclick=()=>{page='dashboard';$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')};$('menu').onclick=()=>document.querySelector('.sidebar').classList.toggle('hidden');
	</script>
</body>
</html>
